name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Validate missions
        # Bloqueia a publicação se alguma missão tiver ERRO (spoiler vazando, link quebrado...)
        run: node src/tools/validar_missoes.js

      - name: Prepare Deployment Directory
        run: |
          # The main static site is in 'public'
          # Only the clean JSON is used by the site (mapa.js); map_data_raw.json is parser input
          mkdir -p public/data-out
          cp data-out/map_data.json public/data-out/

      - name: Stamp build version
        run: |
          # Carimbo exibido no rodapé do hub inicial: commit curto + data/hora de Brasília
          SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          DATA=$(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')
          printf "window.GRB_VERSAO = { commit: '%s', data: '%s' };\n" "$SHA" "$DATA" > public/js/versao.js
          cat public/js/versao.js

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
